spring:
  application:
    name: docflow
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
  jpa:
    databasePlatform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

docflow:
  ingestion:
    workspace-root: ${java.io.tmpdir}/docflow/jobs
    max-repository-size: 100MB
  llm:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
    timeout: 60s
    temperature: 0.2

integration:
  client:
    github:
      base-url: https://api.github.com
      connect-timeout: 2s
      read-timeout: 5s
      token: ${GITHUB_TOKEN:}